<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kudos.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kudos | Inicio</title>
    <script>
      // Apply the stored theme before first paint so dark mode doesn't flash
      // light. ThemeProvider takes over from here (see src/providers).
      (function () {
        var theme = localStorage.getItem("kudos-ui-theme") || "system";
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
